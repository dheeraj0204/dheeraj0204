<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" width="100%" height="100%">
  <defs>
    <style>
      .metric-num {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #F8FAFC;
        letter-spacing: 0.2px;
      }
      .metric-sub {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #94A3B8;
        font-weight: 500;
      }
    </style>

    <clipPath id="clip1"><rect x="16" y="22" width="240" height="44" /></clipPath>
    <clipPath id="clip2"><rect x="16" y="22" width="240" height="44" /></clipPath>
    <clipPath id="clip3"><rect x="16" y="22" width="240" height="44" /></clipPath>
    <clipPath id="clip4"><rect x="16" y="22" width="240" height="44" /></clipPath>
    <clipPath id="clip5"><rect x="16" y="22" width="240" height="44" /></clipPath>

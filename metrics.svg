          keySplines="0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1; 0.1 0.8 0.2 1" />
        <text x="16" y="56" fill="#22D3EE" class="metric-num">0</text>
        <text x="16" y="98" fill="#22D3EE" class="metric-num">2,500</text>
        <text x="16" y="140" fill="#22D3EE" class="metric-num">5,000</text>
